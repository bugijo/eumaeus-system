# Stack de produção na VPS: banco, API e web (Caddy com HTTPS automático).
# Uso: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: eumaeus

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eumaeus
      POSTGRES_DB: eumaeus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eumaeus -d eumaeus"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3333"
      DATABASE_URL: postgresql://eumaeus:${POSTGRES_PASSWORD}@db:5432/eumaeus?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?defina REFRESH_TOKEN_SECRET}
      ALLOW_TEST_DATA_MUTATION: "false"
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      # Assistente de suporte (opcional): sem chave, o chat fica desligado e a central de ajuda continua funcionando.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HELP_ASSISTANT_MODEL: ${HELP_ASSISTANT_MODEL:-claude-haiku-5-5}
      HELP_ASSISTANT_DAILY_LIMIT: ${HELP_ASSISTANT_DAILY_LIMIT:-80}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-eumaeus.com.br}
      WWW_ADDRESS: ${WWW_ADDRESS:-www.eumaeus.com.br}
      PRIMARY_HOST: ${PRIMARY_HOST:-eumaeus.com.br}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
