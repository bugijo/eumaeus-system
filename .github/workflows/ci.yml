name: CI

on:
  push:
    branches: [main, develop, codex/eumaeus-p0-stabilization]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install policy dependencies
        run: npm ci

      - name: Scan current tree and enforce repository invariants
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:policy

      - name: Validate production Render Blueprint
        run: npm run validate:render

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security-policy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-policy
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://eumaeus_ci@localhost:5432/eumaeus_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eumaeus_ci
          POSTGRES_DB: eumaeus_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eumaeus_ci -d eumaeus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Apply migrations to empty PostgreSQL
        run: npm run db:migrate

      - name: Verify migration status
        run: npm run db:status

      - name: Verify migration idempotency
        run: npm run db:migrate

      - name: Verify schema drift
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Verify secure first-owner provisioning on PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          owner_password="Aa1!$(openssl rand -hex 24)"
          access_secret="$(openssl rand -hex 32)"
          refresh_secret="$(openssl rand -hex 32)"
          first_log="$RUNNER_TEMP/eumaeus-owner-first.log"
          second_log="$RUNNER_TEMP/eumaeus-owner-second.log"
          verify_log="$RUNNER_TEMP/eumaeus-production-verify.log"

          export NODE_ENV=test
          export JWT_SECRET="$access_secret"
          export REFRESH_TOKEN_SECRET="$refresh_secret"
          export PROVISION_FIRST_OWNER_CONFIRMATION=CREATE_INITIAL_OWNER
          export INITIAL_OWNER_NAME='CI Synthetic Owner'
          export INITIAL_OWNER_EMAIL='owner-ci@example.invalid'
          export INITIAL_OWNER_PASSWORD="$owner_password"

          npm run owner:provision > "$first_log" 2>&1

          export PRODUCTION_VERIFY_CONFIRMATION=RUN_READ_ONLY_PRODUCTION_CHECK
          export VERIFY_EXPECT_EMPTY_BUSINESS_DATA=true
          export VERIFY_EXPECT_OWNER=true
          npm run production:verify > "$verify_log" 2>&1

          export INITIAL_OWNER_PASSWORD="$owner_password"
          set +e
          npm run owner:provision > "$second_log" 2>&1
          second_status=$?
          set -e
          unset INITIAL_OWNER_PASSWORD

          test "$second_status" -ne 0
          grep -F 'já existe uma conta DONO' "$second_log" > /dev/null

          if grep -F -- "$owner_password" "$first_log" "$second_log" "$verify_log" > /dev/null; then
            echo 'Plaintext owner password appeared in operational logs.' >&2
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8").trim().split("\n").at(-1));
            if (report.migrations.expected !== 2 || report.migrations.applied !== 2) process.exit(1);
            if (report.migrations.failed || report.migrations.missing || report.migrations.unexpected) process.exit(1);
            if (report.migrations.checksumMismatches) process.exit(1);
            if (report.identity.users !== 1 || report.identity.authProfiles !== 1) process.exit(1);
            if (report.identity.ownerAccounts !== 1 || report.identity.activeRefreshTokens !== 0) process.exit(1);
            if (!report.expectations.emptyBusinessData || !report.expectations.ownerProvisioned) process.exit(1);
          ' "$verify_log"

      - name: Verify clear failure with missing environment
        shell: bash
        run: |
          set +e
          env -u DATABASE_URL -u JWT_SECRET -u REFRESH_TOKEN_SECRET NODE_ENV=production \
            node dist/src/bootstrap.js > "$RUNNER_TEMP/eumaeus-missing-env.log" 2>&1
          status=$?
          set -e

          test "$status" -eq 1
          grep -F 'DATABASE_URL' "$RUNNER_TEMP/eumaeus-missing-env.log"
          grep -F 'JWT_SECRET' "$RUNNER_TEMP/eumaeus-missing-env.log"
          grep -F 'REFRESH_TOKEN_SECRET' "$RUNNER_TEMP/eumaeus-missing-env.log"

      - name: Verify valid startup and database health
        shell: bash
        run: |
          access_secret="$(openssl rand -hex 32)"
          refresh_secret="$(openssl rand -hex 32)"

          JWT_SECRET="$access_secret" REFRESH_TOKEN_SECRET="$refresh_secret" \
            NODE_ENV=production PORT=3333 \
            npm start > "$RUNNER_TEMP/eumaeus-startup.log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -TERM "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3333/health \
              > "$RUNNER_TEMP/eumaeus-health.json"; then
              break
            fi
            sleep 1
          done

          curl --fail --show-error http://127.0.0.1:3333/health
