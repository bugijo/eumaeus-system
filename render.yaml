# Production-only Blueprint. Staging is intentionally managed as separate
# resources and must never be attached to this file.
#
# IMPORTANT: Render Blueprint Auto Sync must remain disabled in the dashboard.
# Synchronize this file manually only after approving the paid plan and creating
# the production PostgreSQL database outside the Blueprint.
services:
  - type: web
    name: Eumaeus-backend-oregon
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOW_TEST_DATA_MUTATION
        value: "false"
