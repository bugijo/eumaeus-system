databases:
  - name: Eumaeus-db
    plan: free

services:
  - type: web
    name: Eumaeus-backend-oregon
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: |
      set -e
      npm ci --include=dev
      npm run prisma:generate
      npm run build
      npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    # Keep deployment manual until the existing database is backed up, cloned,
    # and its Prisma baseline is verified. See docs/P0_STABILIZATION_AUDIT.md.
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: Eumaeus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
